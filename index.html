<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Matafuegos</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f2f2f2; padding: 20px; margin: 0; }
    .container { background: white; padding: 20px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #d32f2f; margin-top: 0; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background: #d32f2f; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #b71c1c; }
    #status { margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 6px; display: none; }
    .exito { background: #e8f5e9; color: #2e7d32; display: block !important; }
    .error { background: #ffebee; color: #c62828; display: block !important; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🧯 Control de Matafuegos</h2>
    <p>Escaneá un QR o escribí el ID para guardar directamente en Google Sheets.</p>

    <!-- Escáner QR -->
    <div id="reader"></div>

    <hr style="margin: 20px 0; border: 0.5px solid #eee;">

    <!-- Ingreso Manual -->
    <input type="text" id="manualId" placeholder="Escribí el ID (ej: 33134)" />
    <button onclick="guardarManual()">🚀 Registrar por ID</button>

    <div id="status"></div>
  </div>

  <script>
    // ⚠️ REEMPLAZÁ ESTA URL POR LA TUYA DE GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbyrhsrJ_ZfGC-wF2Pef1jk3VjaS2LCe0MnrzwtGyByvKEyNo1txbpXPpMzpDZtsyqVN/exec";

    function guardarEnSheets(idIngresado) {
      const statusDiv = document.getElementById("status");
      statusDiv.className = "";
      statusDiv.style.display = "block";
      statusDiv.innerText = "⏳ Guardando en Google Sheets...";

      const registro = {
        idQr: idIngresado,
        numExtintor: idIngresado,
        agente: "Polvo Químico ABC",
        capacidad: "5 Kg",
        ubicacion: "Inspección en Planta",
        estado: "OPERATIVO"
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(registro)
      })
      .then(() => {
        statusDiv.className = "exito";
        statusDiv.innerText = "✅ ¡Matafuego ID " + idIngresado + " guardado en Google Sheets!";
        document.getElementById("manualId").value = "";
      })
      .catch(err => {
        statusDiv.className = "error";
        statusDiv.innerText = "❌ Error al conectar con Google Sheets.";
      });
    }

    function guardarManual() {
      const val = document.getElementById("manualId").value.trim();
      if (val) {
        guardarEnSheets(val);
      } else {
        alert("Ingresá un ID válido.");
      }
    }

    // Al detectar un QR con la cámara
    function onScanSuccess(decodedText) {
      guardarEnSheets(decodedText);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
